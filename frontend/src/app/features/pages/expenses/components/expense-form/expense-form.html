<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <!-- Modal Card -->
  <div class="bg-white w-full max-w-lg rounded-4xl shadow-2xl overflow-hidden border border-slate-100">
    
    <!-- Header -->
    <div class="p-8 pb-4 flex justify-between items-center">
      <div>
        <h3 class="text-2xl font-bold text-slate-800">New Expense</h3>
        <p class="text-slate-500 text-sm">Record your spending</p>
      </div>
      <button class="p-2 hover:bg-slate-100 rounded-full text-slate-400 transition-colors" type="button" (click)="closeForm()">
        <svg lucideX class="h-6 w-6"></svg>
      </button>
    </div>

    <!-- Form Content -->
    <form class="p-8 pt-4 space-y-5">
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Description</label>
        <input type="text" placeholder="e.g., Starbucks Coffee" 
               class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Amount</label>
          <div class="relative">
            <span class="absolute left-5 top-4 text-slate-400 font-semibold">₹</span>
            <input type="number" placeholder="0.00" 
                   class="w-full pl-10 pr-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Category</label>
          <select class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all appearance-none">
            <option>Food</option>
            <option>Shopping</option>
            <option>Bills</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-[0.98] mt-4">
        Add Transaction
      </button>
    </form>
  </div>
</div>
